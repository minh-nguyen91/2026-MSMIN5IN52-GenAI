# Workflow GitHub Actions de la suite E2E F1.
#
# GitHub n'exécute que les workflows placés dans .github/workflows/ à la racine
# du dépôt, dossier que la charte du cours (AGENTS.md) interdit de modifier dans
# la PR. Pour l'activer sur un fork, copier ce fichier dans
# .github/workflows/groupe-owui-qa-e2e.yml sur une branche dédiée (hors PR).

name: groupe-owui-qa E2E

on:
  push:
    paths: ['groupe-owui-qa/**', '.github/workflows/groupe-owui-qa-e2e.yml']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: groupe-owui-qa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: groupe-owui-qa/package-lock.json

      # Comptes jetables propres à ce run : rien de secret n'est stocké.
      - name: Créer le .env de CI
        run: |
          {
            echo "OWUI_URL=http://localhost:3000"
            echo "OWUI_TENANT2_URL=http://localhost:3001"
            echo "OWUI_EMAIL=ci-admin@test.local"
            echo "OWUI_PASSWORD=ci-$(openssl rand -hex 12)"
          } > .env

      - name: Démarrer les deux tenants et le LLM simulé
        run: docker compose up -d --wait

      - name: Installer les dépendances
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Créer les comptes admin
        run: npm run seed

      - name: Lancer la suite E2E
        run: npm test

      - name: Logs des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs --tail 200

      - name: Publier le rapport, les traces et les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            groupe-owui-qa/playwright-report/
            groupe-owui-qa/test-results/
          retention-days: 14
